name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The new version to set"
        required: true
      prev_version:
        description: "The previous tagged version"
        required: true
      push_changes:
        description: "Push changes?"
        default: true
        type: boolean
permissions:
  contents: read
defaults:
  run:
    shell: bash -eux {0}
env:
  # Changes per branch
  SILK_ASSET_GROUP: mongodb-go-driver
  EVERGREEN_PROJECT: mongo-go-driver
jobs:
  # Runs every release with pushing turned off, so a broken checkout, bad
  # inputs, or unmerged commits fail here instead of after the tag is pushed.
  dry-run:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - uses: mongodb-labs/drivers-github-tools/secure-checkout@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          # Pre Publish merges into the next branch, which needs that branch
          # and full history in the checkout.
          fetch-depth: 0
      - uses: mongodb-labs/drivers-github-tools/setup@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}
          artifactory_username: ${{ vars.ARTIFACTORY_USERNAME }}
      # The release merges into the next branch with the "ours" strategy, which
      # discards anything an open merge-up PR has not carried over yet.
      - name: Require no open merge-up PRs
        run: |
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open \
            --json number,title,baseRefName,url \
            -q '.[] | select(.title | startswith("Merge release/")) | "#\(.number) \(.title) -> \(.baseRefName) \(.url)"')
          if [ -n "$open" ]; then
            echo "::error::Merge these merge-up PRs before releasing:"
            echo "$open"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # Pre Publish skips its merge into the next branch on a dry run, so
      # check what that merge needs here.
      - name: Release preflight
        run: >-
          go run ./internal/cmd/release-preflight -release-branch "$RELEASE_BRANCH" -version "$VERSION" -prev-version "$PREV_VERSION" -skip-merge-up="$SKIP_MERGE_UP"
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          PREV_VERSION: ${{ inputs.prev_version }}
          SKIP_MERGE_UP: ${{ contains(fromJSON(vars.IGNORED_MERGE_UP_BRANCHES), github.ref_name) }}
      - name: Pre Publish (dry run)
        uses: mongodb-labs/drivers-github-tools/golang/pre-publish@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          version: ${{ inputs.version }}
          push_changes: false
          ignored_branches: ${{ vars.IGNORED_MERGE_UP_BRANCHES }}
          dry_run: true
  pre-publish:
    needs: [dry-run]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      prev_version: ${{ steps.pre-publish.outputs.prev_version }}
    steps:
      - uses: mongodb-labs/drivers-github-tools/secure-checkout@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          # Pre Publish merges into the next branch, which needs that branch
          # and full history in the checkout.
          fetch-depth: 0
      - uses: mongodb-labs/drivers-github-tools/setup@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}
          artifactory_username: ${{ vars.ARTIFACTORY_USERNAME }}
      - name: Pre Publish
        id: pre-publish
        uses: mongodb-labs/drivers-github-tools/golang/pre-publish@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          version: ${{ inputs.version }}
          push_changes: ${{ inputs.push_changes }}
          ignored_branches: ${{ vars.IGNORED_MERGE_UP_BRANCHES }}
          dry_run: ${{ !inputs.push_changes }}
  static-scan:
    needs: [pre-publish]
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      ref: ${{ github.ref }}
  publish:
    needs: [pre-publish, static-scan]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      security-events: read
    steps:
      - uses: mongodb-labs/drivers-github-tools/secure-checkout@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: mongodb-labs/drivers-github-tools/setup@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: ${{ vars.AWS_REGION_NAME }}
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}
          artifactory_username: ${{ vars.ARTIFACTORY_USERNAME }}
      - name: Publish
        uses: mongodb-labs/drivers-github-tools/golang/publish@89904229eb55a063655af02f5838bd7fe76505e5 #v3
        with:
          version: ${{ inputs.version }}
          silk_asset_group: ${{ env.SILK_ASSET_GROUP }}
          evergreen_project: ${{ env.EVERGREEN_PROJECT }}
          prev_version: ${{ inputs.prev_version }}
          push_changes: ${{ inputs.push_changes }}
          token: ${{ env.GH_TOKEN }}
